name: Build Blog

on:
  push:
    branches: [main]
    paths:
      - 'blog_markdown/**'
      - 'blog/template.html'
      - 'scripts/build_blog.py'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install markdown dependency
        run: pip install markdown --break-system-packages

      - name: Run build script
        run: python scripts/build_blog.py

      - name: Commit generated files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add blog/index.html blog/posts.json blog/.build_hashes.json blog/*.html
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "build: regenerate blog from markdown"
            git push origin main
          fi
