name: Build Blog

on:
  push:
    branches: [main]
    paths:
      - 'blog_markdown/**'
      - 'blog/template.html'
      - 'scripts/build_blog.py'
      - '.github/workflows/build-blog.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install markdown --break-system-packages

      - name: Generate blog HTML
        run: |
          python scripts/build_blog.py

      - name: Verify generated blog
        run: |
          echo "Generated blog files:"
          ls -la blog

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

  deploy:
    needs: build
    runs-on: ubuntu-latest

    permissions:
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
